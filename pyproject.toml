[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pinbench"
version = "0.1.0"
description = "Pin your models. Bench a candidate before you switch."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Owen Carlsen" }]
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
pinbench = "pinbench.cli:main"

[tool.setuptools.packages.find]
include = ["pinbench*"]
