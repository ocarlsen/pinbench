# USD per million tokens. Source + date per row; an unpriced model refuses to run.
version: 1
checked: 2026-10-26
models:
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
    # The 400 this model returns on `thinking: {"type": "disabled"}` (observed 2026-10-26,
    # run .pinbench/runs/summaries-v3): "To turn thinking off on this model, send
    # \"thinking\": {\"type\": \"between_tools\"} instead of {\"type\": \"disabled\"}."
    request_defaults:
      thinking: {type: between_tools}
  gpt-5-mini:
    input: 0.25
    output: 2.00
    source: "https://developers.openai.com/api/docs/pricing"
  gpt-5-nano:
    input: 0.05
    output: 0.40
    source: "https://developers.openai.com/api/docs/pricing"
  claude-opus-5-5:
    # Base tier, standard (non-fast-mode) rate, verified 2026-10-26.
    input: 4.00
    output: 20.00
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
    # Opus 5.5 cannot turn thinking off: the model-configuration table at
    # https://platform.claude.com/docs/en/build-with-claude/thinking shows every `thinking`
    # value other than "adaptive" (no field, "enabled", "between_tools", "disabled") returns
    # a 400 on this model; adaptive thinking is always on. Its default effort is "medium"
    # (same page, "Migrating to adaptive thinking"); no request_defaults value here turns it
    # off, so a judge suite using this model needs a generous judge.max_output_tokens --
    # thinking tokens are billed as output and count against that ceiling, same failure mode
    # as the empty-output defect this README documents for arms.
  claude-haiku-5-5:
    # Base tier (prompts <= 100,000 tokens); the API bills this rate for suites like
    # examples/suites/*.yaml, which are far under that threshold. The overview page's
    # "from $0.10/$0.50" is this same base rate -- "from" refers to the long-context
    # tier (prompts over 100,000 tokens cost 5x: $0.50/$2.50), not a volume discount.
    input: 0.10
    output: 0.50
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
    # thinking: {"type": "disabled"} observed from the API, 2026-10-26 (run
    # .pinbench/runs/summaries-v3: 10/10 accepted, no 400 -- not documented either way on
    # the pricing/models pages above, so this is an observation, not a cited doc).
    request_defaults:
      thinking: {type: disabled}
